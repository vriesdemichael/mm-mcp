// author marked Important or Urgent, with its icon.
function priorityLabel(priority) {
  if (priority === "urgent") return [icon("alert"), t("post.priority_urgent")];
  if (priority === "important") return [icon("alert-circle"), t("post.priority_important")];
  return null;
}

function marks(post) {
  const found = [];
  const priority = priorityLabel(post.priority);
  if (priority) found.push(el("span", { class: "priority-tag", dataset: { priority: post.priority } }, priority));
  // A burn-on-read post is marked, with when it burns for the person in its
  // title, as Mattermost's badge and timer show it.
  if (post.type === "burn_on_read") {
    found.push(el("span", { class: "mark burn", title: post.expire_at ? t("post.burns_at", { time: formatMoment(post.expire_at) }) : null },
      icon("flame"), t("post.burn_on_read")));
  }
  if (post.pinned) found.push(el("span", { class: "mark pinned" }, icon("pin"), t("post.pinned")));
  if (post.ai_generated) found.push(el("span", { class: "mark muted" }, t("post.ai")));
  return found;
}

function isObject(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value);
}

// renderQuote is the post a post links to, quoted below its message as
// Mattermost quotes it: its author, under the name an integration chose,
// when, its label, its message, its own preview, and the channel it was
// posted in. A long message is cut to a height, with a button that shows the
// rest, and all of it opens the post: the box, for a pointer, and its time, for
// a keyboard. A link or a button in it does its own thing, and selecting its
// text opens nothing.
function renderQuote(quote, markdown) {
  const text = (value) => typeof value === "string" ? value : "";
  const at = text(quote.created_at);
  const files = Array.isArray(quote.files) ? quote.files.length : 0;
  const priority = priorityLabel(quote.priority);
  const label = at ? formatTime(at) : t("quote.open");
  const opens = isWebURL(text(quote.url));
  const box = el("blockquote", { class: "quote", dataset: { opens: opens ? "true" : "false" } },
    el("div", { class: "post-header" },
      el("span", { class: "author", title: text(quote.shown_as) && text(quote.author) ? "@" + quote.author : null },
        text(quote.shown_as) || text(quote.author_name) || text(quote.author)),
      opens
        ? el("button", { type: "button", class: "link time", title: quote.url, "aria-label": t("quote.open"), onclick: () => openQuote(quote) }, label)
        : el("span", { class: "link time", "aria-label": t("quote.open") }, label),
      priority ? el("span", { class: "priority-tag", dataset: { priority: quote.priority } }, priority) : null,
      quote.ai_generated === true ? el("span", { class: "mark muted" }, t("post.ai")) : null),
    clampedToHeight(renderMarkdown(text(quote.message), markdown), quote.id),
    quote.message_length ? el("p", { class: "muted cut" }, t("post.cut", { count: quote.message_length }), " ", linkButton(text(quote.url), [t("post.read_whole")])) : null,
    files > 0 ? el("div", { class: "muted quote-files" }, icon("file"), t("quote.files", { count: files })) : null,
    isObject(quote.link_preview) ? renderLinkPreview(quote.link_preview, markdown) : null,
    text(quote.channel) ? el("div", { class: "muted quote-channel" }, t("quote.channel", { channel: quote.channel })) : null);
  if (opens) {
    box.addEventListener("click", (event) => {
      if (event.target.closest("a, button, summary") || String(window.getSelection())) return;
      openQuote(quote);
    });
  }
  return box;
}

// wholeQuotes are the quotes the person asked to see all of, by the post each
// quotes, which outlast the view being drawn again.
const wholeQuotes = new Set();

// clampedToHeight cuts a quote's text to a height, and fades what is cut where
// it is, since only a laid out element knows how tall it is. The button that
// shows the rest needs no call: the quote already holds all of it.
function clampedToHeight(box, id) {
  box.classList.add("quote-text");
  const more = el("button", { type: "button", class: "link quote-more" });
  const show = () => {
    const whole = wholeQuotes.has(id);
    box.dataset.whole = whole ? "true" : "false";
    more.textContent = whole ? t("quote.less") : t("quote.more");
    more.setAttribute("aria-expanded", whole ? "true" : "false");
  };
  more.addEventListener("click", () => {
    if (!wholeQuotes.delete(id)) wholeQuotes.add(id);
    show();
  });
  show();
  new ResizeObserver(() => {
    box.dataset.clamped = box.scrollHeight > box.clientHeight + 1 ? "true" : "false";
  }).observe(box);
  return [box, more];
}

// openQuote opens the post a quote shows: in a thread, where the host lets the
// view call tools, in the view's place, with the way back, and otherwise in
// Mattermost. Where the host refuses the call, the view says so and offers it
// in Mattermost.
async function openQuote(quote) {
  if (!view.callsTools || !view.input || view.input.kind !== "thread" || typeof quote.id !== "string" || quote.id === "") {
    openLink(quote.url);
    return;
  }
  try {
    const result = await bridge.callTool("view_action", { action: "thread", post_id: quote.id });
    const data = result && !result.isError ? result.structuredContent : null;
    if (!data || typeof data !== "object") throw new Error("nothing came back");
    view.trail.push(view.result);
    view.result = data;
    view.notice = null;
    render();
    const back = document.querySelector(".back");
    if (back) back.focus();
  } catch {
    notice(t("quote.open_refused"), quote.url);
  }
}

// backButton is the way back from a post opened from a quote.
function backButton() {
  return el("button", {
    type: "button",
    class: "more back",
    onclick: () => {
      view.result = view.trail.pop();
      render();
    },
  }, icon("back"), t("thread.back"));
}

// renderLinkPreview is the page or picture a post's first link leads to, as
// Mattermost shows it below the message: a page's site, its title linking to
// it and its description, and a picture named rather than drawn, as an image
// in a message is, since the view has no network.
function renderLinkPreview(preview, markdown) {
  const text = (value) => typeof value === "string" ? value : "";
  if (preview.image === true) {
    return el("div", { class: "link-preview link-image" }, namedImage(text(preview.url), markdown));
  }
  if (!text(preview.title) && !text(preview.description) && !text(preview.site_name)) return null;
  return el("div", { class: "link-preview" },
    text(preview.site_name) ? el("div", { class: "muted link-site" }, preview.site_name) : null,
    text(preview.title) ? el("h3", { class: "link-title" }, linkButton(text(preview.url), [preview.title])) : null,
    text(preview.description) ? el("p", { class: "link-description" }, preview.description) : null);
}

// namedImage is a picture an address leads to, named as given or after its
// file, which opens through the host on a click, as an image in a message
// does.
function namedImage(url, markdown, given) {
  let name = typeof given === "string" ? given : "";
  try {
    name = name || decodeURIComponent(new URL(url).pathname.split("/").pop() || "");
  } catch {
    name = name || "";
  }
  return markdownImage(name, url, { base: markdown.base });
}

// BLOCKS_DRAWN is the most blocks the view draws of a post, as many as
// Mattermost keeps.
const BLOCKS_DRAWN = 100;

// renderBlocks draws what an integration posted as blocks or cards, as
// Mattermost draws them. They come as an outline: a container, collapsible,
// column set or column holds the blocks after it that are deeper.
function renderBlocks(blocks, markdown) {
  const root = el("div", { class: "blocks" });
  const open = [{ depth: -1, holder: root }];
  for (const block of blocks.slice(0, BLOCKS_DRAWN)) {
    if (!isObject(block)) continue;
    const depth = Number.isInteger(block.depth) && block.depth > 0 ? block.depth : 0;
    while (open.length > 1 && open[open.length - 1].depth >= depth) open.pop();
    const drawn = drawBlock(block, markdown);
    if (!drawn) continue;
    open[open.length - 1].holder.append(drawn.node);
    if (drawn.holds) open.push({ depth, holder: drawn.node });
  }
  return root;
}

// drawBlock is one block, and whether it holds the blocks after it. A
// container's bar is the view's color nearest the one the integration chose,
// a collapsible is folded where Mattermost folds it, and an image is named
// rather than drawn.
function drawBlock(block, markdown) {
  const text = (value) => typeof value === "string" ? value : "";
  switch (block.type) {
  case "text":
    return { node: el("div", { class: block.subtle === true ? "block-text muted" : "block-text" }, renderMarkdown(text(block.text), markdown)) };
  case "image":
    return { node: el("div", { class: "block-image", title: text(block.title) || null }, namedImage(text(block.url), markdown, text(block.alt_text))) };
  case "divider":
    return { node: el("hr", { class: "block-divider" }) };
  case "container":
    return { node: el("div", { class: "block-container", dataset: { bar: blockBar(block.accent_color), border: block.border === true ? "true" : "false" } }), holds: true };
  case "collapsible":
    return { node: el("details", { class: "block-collapsible", open: block.collapsed !== true }, el("summary", {}, renderMarkdown(text(block.text), markdown))), holds: true };
  case "column_set":
    return { node: el("div", { class: "block-columns" }), holds: true };
  case "column":
    return { node: el("div", { class: "block-column" }), holds: true };
  }
  return null;
}

// blockBar is the view's color for a container's bar: the two Mattermost
// names for blocks alone, and otherwise as a card's.
function blockBar(color) {
  if (color === "primary") return "blue";
  if (color === "default") return "gray";
  return barOf(color);
}

// concealedPlaceholder stands in for a burn-on-read post the person has not
// revealed, as Mattermost conceals it. Revealing it is theirs to do, in
// Mattermost: it starts the timer after which the post is gone for them.
function concealedPlaceholder(post) {
  return el("div", { class: "concealed", role: "note" },
    icon("flame"),
    el("span", { class: "concealed-text" }, t("post.concealed")),
    linkButton(post.url, [t("post.view_message")], { class: "link concealed-open" }));
}

// renderCall draws a call the Calls plugin started, in place of the post's
// message; its join link opens the post in Mattermost.
function renderCall(post, call) {
  const text = (value) => typeof value === "string" ? value : "";
  const ended = text(call.ended_at) !== "";
  const starter = post.author_name || post.author;
  const people = Array.isArray(call.participants) ? call.participants.filter((name) => typeof name === "string") : [];
  let detail;
  if (ended) {
    const minutes = minutesBetween(call.started_at, call.ended_at);
    detail = [t("call.ended_at", { time: formatTime(call.ended_at) }),
      minutes === null ? null : el("span", { class: "call-divider", "aria-hidden": "true" }, " · "),
      minutes === null ? null : minutes < 1 ? t("call.lasted_moment") : t("call.lasted", { duration: formatMinutes(minutes) })];
  } else {
    detail = text(call.started_at) ? t("call.started_by", { time: formatTime(call.started_at), name: starter }) : t("call.by", { name: starter });
  }
  return el("div", { class: "call" },
    text(call.title) ? el("h3", { class: "call-title" }, call.title) : null,
    el("div", { class: "call-card", dataset: { ended: ended ? "true" : "false" } },
      el("span", { class: "call-icon" }, icon("phone")),
      el("div", { class: "call-text" },
        el("strong", {}, ended ? t("call.ended") : t("call.started")),
        el("span", { class: "muted call-detail" }, detail),
        people.length > 0 ? el("span", { class: "muted call-people" }, t("call.participants", { count: people.length, names: people.map((name) => "@" + name).join(", ") })) : null),
      ended ? null : linkButton(post.url, [t("call.join")], { class: "link call-join" })));
}

// minutesBetween is how many whole minutes passed between two times, or null
// when either is missing or the second comes first.
function minutesBetween(from, to) {
  const start = wallTime(from);
  const end = wallTime(to);
  if (!start || !end || end < start) return null;
  return Math.floor((end - start) / 60000);
}

// formatMinutes is a length of time in hours and minutes, as Mattermost says
// how long a call lasted.
function formatMinutes(minutes) {
  const unit = (count, name) => new Intl.NumberFormat(language, { style: "unit", unit: name, unitDisplay: "long" }).format(count);
  const hours = Math.floor(minutes / 60);
  if (hours === 0) return unit(minutes, "minute");
  return minutes % 60 === 0 ? unit(hours, "hour") : unit(hours, "hour") + ", " + unit(minutes % 60, "minute");
}

// messageAttachment is a card an integration posted, as Mattermost draws it:
// its pretext above it, and in it, beside a colored bar, its author, its title,
// each linking where the integration says, its thumbnail, its text, its
// fields, two short ones to a row, its picture, and its footer. Its pictures
// are named rather than drawn, since the view has no network. Its fallback is what a notification shows,
// and is not drawn, and a card with nothing else is not drawn either.
function messageAttachment(card, markdown) {
  const text = (value) => typeof value === "string" ? value : "";
  const parts = [
    text(card.author_name) ? el("div", { class: "attachment-author" }, linkButton(text(card.author_link), [card.author_name])) : null,
    text(card.title) ? el("h3", { class: "attachment-title" }, linkButton(text(card.title_link), [card.title])) : null,
    text(card.thumb_url) ? el("div", { class: "attachment-thumb" }, namedImage(card.thumb_url, markdown)) : null,
    text(card.text) ? renderMarkdown(card.text, markdown) : null,
    attachmentFields(card.fields, markdown),
    text(card.image_url) ? el("div", { class: "attachment-image" }, namedImage(card.image_url, markdown)) : null,
    text(card.footer) ? el("div", { class: "attachment-footer muted" }, card.footer) : null,
  ].filter(Boolean);
  return el("div", { class: "attachment" },
    text(card.pretext) ? renderMarkdown(card.pretext, markdown) : null,
    parts.length > 0 ? el("div", { class: "attachment-card", dataset: { bar: barOf(card.color) } }, parts) : null);
}

// attachmentFields lays out fields as Mattermost does: a short field shares
// its row with the next short one, and a long one has a row of its own.
function attachmentFields(fields, markdown) {
  if (!Array.isArray(fields)) return null;
  const rows = [];
  let row = [];
  let long = false;
  for (const field of fields) {
    if (!field || typeof field !== "object") continue;
    if (row.length === 2 || field.short !== true || long) {
      if (row.length > 0) rows.push(row);
      row = [];
    }
    row.push(field);
    long = field.short !== true;
  }
  if (row.length > 0) rows.push(row);
  if (rows.length === 0) return null;
  return el("div", { class: "attachment-fields" }, rows.map((cells) => el("table", { class: "attachment-row" },
    el("thead", {}, el("tr", {}, cells.map((field) => el("th", {}, typeof field.title === "string" ? field.title : "")))),
    el("tbody", {}, el("tr", {}, cells.map((field) => el("td", {}, renderMarkdown(typeof field.value === "string" ? field.value : "", markdown))))))));
}

// ATTACHMENT_BARS are the colors Mattermost names for a card's bar, by the
// fixed color of the view's own that draws each.
const ATTACHMENT_BARS = { good: "green", warning: "yellow", danger: "red" };

const HEX_COLOR = /^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
const RGBA_COLOR = /^rgba?\((\d+), (\d+), (\d+)(?:, ([\d.]+))?\)$/;

// hexRGB is a hex color's red, green, blue and opacity, from 0 to 1.
function hexRGB(color) {
  const hex = HEX_COLOR.exec(color);
  if (!hex) return null;
  let digits = hex[1];
  if (digits.length <= 4) digits = digits.split("").map((digit) => digit + digit).join("");
  return [0, 2, 4, 6].map((at) => at < digits.length ? parseInt(digits.slice(at, at + 2), 16) / 255 : 1);
}

let colorReader;

// cssRGB reads any other CSS color, such as red or rgb(220, 0, 0), as the
// browser reads it: set on a canvas that is never drawn on or shown, which
// answers in hex or rgba(). A value the canvas rejects leaves the previous
// color in place, so the color is set after black and after white, and kept
// only when both read back the same.
function cssRGB(color) {
  if (colorReader === undefined) colorReader = document.createElement("canvas").getContext("2d");
  if (!colorReader) return null;
  const read = (before) => {
    colorReader.fillStyle = before;
    colorReader.fillStyle = color;
    return colorReader.fillStyle;
  };
  const read1 = read("#000000");
  if (read1 !== read("#ffffff")) return null;
  const rgba = RGBA_COLOR.exec(read1);
  if (!rgba) return hexRGB(read1);
  return [rgba[1] / 255, rgba[2] / 255, rgba[3] / 255, rgba[4] === undefined ? 1 : Number(rgba[4])];
}

// barOf is the view's color for a card's bar. Colors never come from
// Mattermost content, so a color an integration chose is drawn in the view's
// color nearest its hue, which keeps red apart from green, firing from
// resolved: gray when it has little color, and none when it is no color or
// cannot be seen.
function barOf(color) {
  if (typeof color !== "string") return "none";
  if (Object.hasOwn(ATTACHMENT_BARS, color)) return ATTACHMENT_BARS[color];
  const rgb = hexRGB(color) ?? cssRGB(color);
  if (!rgb || rgb[3] === 0) return "none";
  const [r, g, b] = rgb;
  const high = Math.max(r, g, b);
  const low = Math.min(r, g, b);
  if (high - low < 0.15) return "gray";
  let hue;
  if (high === r) hue = ((g - b) / (high - low) + 6) % 6;
  else if (high === g) hue = (b - r) / (high - low) + 2;
  else hue = (r - g) / (high - low) + 4;
  hue *= 60;
  if (hue < 15 || hue >= 330) return "red";
  if (hue < 40) return "orange";
  if (hue < 70) return "yellow";
  if (hue < 170) return "green";
  if (hue < 260) return "blue";
  return "purple";
}

function renderFiles(post) {
  return el("div", { class: "files" }, post.files.map((file) => {
    if (!file.preview_uri) return fileCard(file, post);
    return view.lightbox && view.lightbox.uri === file.preview_uri ? view.lightbox.box : imageCard(file);
  }));
}

// imageCard is an image as its post shows it: its preview, and the whole
// image on a click.
function imageCard(file) {
  const name = file.name || t("file.unnamed");
  const frame = el("button", {
    type: "button",
    class: "image-card",
    "aria-label": t("file.view_image", { name }),
    title: name,
    onclick: () => showImageWhole(file),
  }, el("span", { class: "image-placeholder" }, icon("image"), name));
  if (file.width > 0 && file.height > 0) {
    frame.dataset.sized = "true";
    frame.setAttribute("aria-description", t("file.dimensions", { width: file.width, height: file.height }));
  }
  readPicture(file.preview_uri).then((url) => {
    if (!url) return;
    // The image's own size, so the picture keeps its shape however large
    // the preview is.
    const img = el("img", { alt: name, src: url, width: file.width > 0 ? file.width : undefined, height: file.height > 0 ? file.height : undefined });
    if (img.hasAttribute("src")) frame.replaceChildren(img);
  });
  return frame;
}

// showImageWhole opens an image where its card is, as wide as the post's column
// lets it be, so that it opens where the person is looking in a long thread.
function showImageWhole(file) {
  const name = file.name || t("file.unnamed");
  const close = el("button", { type: "button", class: "close", "aria-label": t("image.close") }, "×");
  const holder = el("div", { class: "lightbox-image" }, el("span", { class: "muted", role: "status" }, t("image.loading")));
  const box = el("div", { class: "lightbox", role: "dialog", "aria-label": name, tabindex: "-1" },
    el("div", { class: "lightbox-bar" }, el("span", { class: "ellipsis" }, name), close),
    holder);
  const done = () => {
    view.lightbox = null;
    render();
  };
  close.addEventListener("click", done);
  box.addEventListener("keydown", (event) => {
    if (event.key === "Escape") done();
  });
  // Where the whole image cannot be read, its preview is what there is.
  readPicture(file.uri).then((url) => url || readPicture(file.preview_uri)).then((url) => {
    const img = url ? el("img", { alt: name, src: url }) : null;
    holder.replaceChildren(img && img.hasAttribute("src") ? img : el("span", { class: "muted" }, t("image.unavailable")));
  });
  view.lightbox = { uri: file.preview_uri, box };
  render();
  close.focus();
}

function fileCard(file, post) {
  return el("div", { class: "file-card" },
    icon("file"),
    el("span", { class: "file-text" },
      el("span", { class: "file-name ellipsis" }, file.name || t("file.unnamed")),
      el("span", { class: "muted file-meta" }, [file.mime_type, file.size > 0 ? formatSize(file.size) : ""].filter(Boolean).join(" · "))),
    linkButton(post.url, [icon("open", t("file.open"))], { class: "link icon-button", "aria-label": t("file.open") }));
}

// withheldFiles stands in for the files an access policy withholds from the
// person, as Mattermost's placeholder does, however many there are.
function withheldFiles() {
  return el("div", { class: "file-card withheld" },
    icon("file"),
    el("span", { class: "file-text" },
      el("span", { class: "file-name" }, t("file.withheld")),
      el("span", { class: "muted file-meta" }, t("file.withheld_why"))));
}

// renderAcknowledgements is the count of people who acknowledged a post that
// asks for it, with who in its title, as reactions name who reacted. Pressing
// it in Mattermost acknowledges the post, which here is not the view's to do.
function renderAcknowledgements(post) {
  const given = Array.isArray(post.acknowledgements) ? post.acknowledgements.filter((ack) => ack && typeof ack.user === "string") : [];
  const who = given.map((ack) => "@" + ack.user).join(", ");
  return el("span", {
    class: "acknowledgements",
    dataset: { acknowledged: post.acknowledged === true ? "true" : "false" },
    title: given.length > 0 ? t("acknowledgements.who", { count: given.length, who }) : t("acknowledgements.none"),
  }, icon("check"), el("span", { class: "acknowledgement-count" }, formatNumber(given.length)));
}

function renderReactions(reactions) {
  const names = Object.keys(reactions);
  if (names.length === 0) return null;
  return el("ul", { class: "reactions", "aria-label": t("reactions.label") }, names.map((name) => {
    const people = Array.isArray(reactions[name]) ? reactions[name] : [];
    const who = people.map((person) => "@" + person).join(", ");
    return el("li", { class: "reaction", title: t("reactions.who", { count: people.length, who, emoji: ":" + name + ":" }) },
      emoji(name), el("span", { class: "reaction-count" }, formatNumber(people.length)));
  }));
}

// moreReplies offers the replies the page left out, a page at a time,
// through the tool only views call; where the host refuses, the thread opens
// in Mattermost.
function moreReplies(data, root, left) {
  const button = el("button", { type: "button", class: "more" }, icon("more"), t("thread.more", { count: left }));
  button.addEventListener("click", async () => {
    if (!data.next_cursor || !view.callsTools) {
      openLink(root.url);
      return;
    }
    button.disabled = true;
    try {
      const result = await bridge.callTool("view_action", { action: "more", post_id: root.id, cursor: data.next_cursor, limit: MORE_REPLIES });
      const page = result && !result.isError ? result.structuredContent : null;
      if (!page || !Array.isArray(page.thread)) throw new Error("no page");
      const known = new Set(data.thread.map((post) => post.id));
      data.thread = data.thread.concat(page.thread.filter((post) => !known.has(post.id)));
      data.next_cursor = page.next_cursor || "";
      render();
    } catch {
      button.disabled = false;
      notice(t("thread.more_refused"), root.url);
    }
  });
  return el("div", { class: "more-row" },
    button,
    linkButton(root.url, [t("thread.open")], { class: "link muted" }));
}

// renderPosted is a post as posted, as create_post, dm and group_message
// answer with it: the post alone, under where it went, and for a reply, the
// way to its thread.
function renderPosted(post) {
  const place = placeOf(post);
  return el("article", { class: "thread posted" },
    el("header", { class: "thread-header" },
      el("span", { class: "muted posted-label" }, post.root_id ? t("post.replied") : t("post.posted")),
      el("h2", { class: "thread-title" },
        place.channel ? linkButton(place.channelURL, [place.channel], { class: "link channel-name" }) : t("thread.title")),
      place.team ? el("span", { class: "muted team" }, place.team) : null),
    el("ol", { class: "posts", "aria-label": t("thread.posts") }, renderPost(post, { asked: false, continued: false, place })),
    post.root_id ? el("div", { class: "more-row" }, linkButton(post.url, [t("thread.open")], { class: "link muted" })) : null);
}

// ---- unreads.js ----
// What is unread for the person, as Mattermost counts it: their channels with
// something unread, grouped by team, the posts that mention them, and the
// threads they follow with unread replies. The data is what get_user_channels
// with unread_only, list_mentions and list_threads with unread_only answer
// (ADR-022), a page of each; where Mattermost has more, the view says so.
//
// A channel's unread messages, and a thread, open in place through the tool
// that only views call and changes nothing, or in Mattermost where the host
// refuses it. Mark read goes through the one that changes something, which
// the server offers only where writes are allowed (CHANGES).

// UNREAD_PAGE is how many posts a channel opened in place shows.
const UNREAD_PAGE = 30;

// opened is what is open in place: one channel or thread at a time.
const opened = { key: "", kind: "", data: null };

function renderUnreads(data) {
  const channels = data.channels && Array.isArray(data.channels.channels) ? data.channels.channels : [];
  const mentions = data.mentions && Array.isArray(data.mentions.posts) ? data.mentions.posts : [];
  const threads = data.threads && Array.isArray(data.threads.threads) ? data.threads.threads : [];
  if (channels.length === 0 && mentions.length === 0 && threads.length === 0) {
    return el("p", { class: "muted", role: "status" }, t("unreads.nothing"));
  }
  return el("article", { class: "unreads" },
    channels.length > 0 ? section("channels", t("unreads.channels"), channelGroups(channels), data.channels.next_cursor ? t("unreads.more_channels") : "") : null,
    mentions.length > 0 ? section("mentions", t("unreads.mentions"), el("ul", { class: "unread-list" }, mentions.map(mentionRow)), data.mentions.next_cursor ? t("unreads.more_mentions") : "") : null,
    threads.length > 0 ? section("threads", t("unreads.threads"), el("ul", { class: "unread-list" }, threads.map(threadRow)), data.threads.next_cursor ? t("unreads.more_threads") : "") : null);
}

function section(name, title, list, more) {
  return el("section", { class: "unread-section", "aria-label": title },
    el("h2", { class: "unread-heading" }, title),
    list,
    more ? el("p", { class: "muted more-note" }, more) : null);
}

// channelGroups lists the channels by team, in Mattermost's order: most
// recently active first. Direct and group messages, which belong to no team,
// are a group of their own.
function channelGroups(channels) {
  const groups = new Map();
  for (const channel of channels) {
    const team = channel.type === "direct" || channel.type === "group" ? t("unreads.direct") : channel.team || t("unreads.direct");
    if (!groups.has(team)) groups.set(team, []);
    groups.get(team).push(channel);
  }
  return el("div", { class: "unread-groups" }, [...groups].map(([team, listed]) =>
    el("div", { class: "unread-group" },
      el("h3", { class: "muted unread-team" }, team),
      el("ul", { class: "unread-list" }, listed.map(channelRow)))));
}

function channelRow(channel) {
  const key = "channel:" + channel.id;
  const unread = typeof channel.unread_messages === "number" ? channel.unread_messages : 0;
  const mentioned = typeof channel.mentions === "number" ? channel.mentions : 0;
  const name = channel.type === "direct" ? "@" + channel.display_name : channel.display_name;
  const row = el("li", { class: "unread-row" + (channel.marked ? " marked" : "") },
    el("div", { class: "unread-line" },
      el("button", {
        type: "button",
        class: "link unread-name ellipsis",
        "aria-expanded": String(opened.key === key),
        onclick: () => openInPlace(key, "channel", channel.url, { action: "unread", channel_id: channel.id, limit: UNREAD_PAGE }),
      }, name),
      channel.marked
        ? el("span", { class: "muted unread-count" }, t("unreads.marked"))
        : [
          mentioned > 0 ? el("span", { class: "badge", title: t("unreads.mentioned", { count: mentioned }) }, "@" + formatNumber(mentioned)) : null,
          el("span", { class: "muted unread-count" }, t("unreads.unread", { count: unread })),
          markRead(channel),
        ]));
  if (opened.key === key && opened.data) row.append(openedChannel(opened.data, channel));
  return row;
}

// markRead offers Mark read, where the server lets a view mark a channel read
// and the host lets the view call a tool.
function markRead(channel) {
  if (!CHANGES || !view.callsTools) return null;
  const button = el("button", { type: "button", class: "link muted mark-read" }, t("unreads.mark_read"));
  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      const result = await bridge.callTool("view_change", { action: "mark_read", channel_id: channel.id });
      if (!result || result.isError) throw new Error("refused");
      channel.marked = true;
      render();
    } catch {
      button.disabled = false;
      notice(t("unreads.mark_refused"), channel.url);
    }
  });
  return button;
}

function mentionRow(post) {
  const key = "mention:" + post.id;
  const row = el("li", { class: "unread-row" },
    el("div", { class: "unread-line" },
      el("button", {
        type: "button",
        class: "link unread-name ellipsis",
        "aria-expanded": String(opened.key === key),
        onclick: () => openInPlace(key, "thread", post.url, { action: "thread", post_id: post.id, limit: MORE_REPLIES }),
      }, post.channel || t("unreads.direct")),
      el("span", { class: "muted unread-count", title: formatMoment(post.created_at) }, formatTime(post.created_at))),
    el("ol", { class: "posts compact" }, renderPost(post, { asked: false, continued: false, place: placeOf(post) })));
  if (opened.key === key && opened.data) row.append(openedThread(opened.data));
  return row;
}

function threadRow(thread) {
  const key = "thread:" + thread.root_id;
  const started = thread.started || {};
  const unread = typeof thread.unread_replies === "number" ? thread.unread_replies : 0;
  const mentioned = typeof thread.unread_mentions === "number" ? thread.unread_mentions : 0;
  const row = el("li", { class: "unread-row" },
    el("div", { class: "unread-line" },
      el("button", {
        type: "button",
        class: "link unread-name ellipsis",
        "aria-expanded": String(opened.key === key),
        onclick: () => openInPlace(key, "thread", started.url, { action: "thread", post_id: thread.root_id, limit: MORE_REPLIES }),
      }, started.channel || t("unreads.direct")),
      mentioned > 0 ? el("span", { class: "badge", title: t("unreads.mentioned", { count: mentioned }) }, "@" + formatNumber(mentioned)) : null,
      el("span", { class: "muted unread-count" }, t("unreads.unread_replies", { count: unread }))),
    el("p", { class: "unread-excerpt ellipsis" }, started.message || ""),
    Array.isArray(thread.participants) && thread.participants.length > 0
      ? el("p", { class: "muted unread-people ellipsis" }, thread.participants.map((person) => "@" + person).join(", "))
      : null);
  if (opened.key === key && opened.data) row.append(openedThread(opened.data));
  return row;
}

// openInPlace opens a channel or a thread under its row through the tool
// that only views call, or closes it when it is open. Where the host refuses
// the call, the view says so and offers it in Mattermost.
async function openInPlace(key, kind, url, args) {
  if (opened.key === key) {
    opened.key = "";
    opened.data = null;
    render();
    return;
  }
  if (!view.callsTools) {
    openLink(url);
    return;
  }
  try {
    const result = await bridge.callTool("view_action", args);
    const data = result && !result.isError ? result.structuredContent : null;
    if (!data || typeof data !== "object") throw new Error("nothing came back");
    opened.key = key;
    opened.kind = kind;
    opened.data = data;
    render();
  } catch {
    notice(t("unreads.open_refused"), url);
  }
}

// openedChannel is a channel's unread messages, as read_unread answers them:
// a few the person has read, then the ones they have not.
function openedChannel(data, channel) {
  const posts = Array.isArray(data.posts) ? data.posts : [];
  const place = placeOf({ channel: data.channel || channel.display_name, channel_url: data.channel_url || channel.url, team: data.team || channel.team, url: posts.length > 0 ? posts[0].url : channel.url });
  const list = el("ol", { class: "posts", "aria-label": t("thread.posts") });
  let previous = null;
  for (const post of posts) {
    if (post.id === data.first_unread_id) {
      list.append(el("li", { class: "day new-messages", role: "separator" }, el("span", {}, t("unreads.new_messages"))));
      previous = null;
    }
    list.append(renderPost(post, { asked: false, continued: continues(previous, post), place }));
    previous = post;
  }
  return el("div", { class: "opened" },
    list,
    el("div", { class: "more-row" }, linkButton(channel.url, [t("unreads.open_channel")], { class: "link muted" })));
}

// openedThread is a thread, as read_post answers it, drawn as the thread view
// draws one.
function openedThread(data) {
  return el("div", { class: "opened" }, renderThread(data));
}

// ---- proposal.js ----
// A post the model proposed, drawn as it will be posted, waiting as the
// person's draft in Mattermost (ADR-035). The data is what propose_post
// answers: the draft and where it waits, or, where a draft of the person's
// own is in the way, both, for them to choose between.
//
// Every press goes through the tool only views call that changes something,
// which the server offers where writes are allowed (CHANGES), and names the
// text the view shows: mm-mcp acts only while the draft still holds it, and a
// draft changed since is drawn again as it is. Post is offered only where the
// server posts from a view (POSTS); elsewhere the draft waits in Mattermost
// for the person to send. The preview hides nothing that is sent: a link
// shows where it leads, a character the eye cannot see is flagged, and the
// text as written is a click away. What the person did reaches the model
// through Mattermost, and, where the host passes it on, through
// ui/update-model-context in mm-mcp's fixed words; never as a message in
// their name.

// proposed is the proposal the view shows, and what the person is doing with
// it. A result drawn again, as a host does when a conversation is reopened,
// starts it afresh from that result.
const proposed = {
  source: null,
  draft: null,
  theirs: null,
  stage: "",
  text: "",
  written: false,
  confirm: null,
  post: null,
  busy: false,
  // A Post that got no answer may have posted: it is not offered again.
  unsure: false,
};

// WHOLE_CHANNEL are the mentions that alert everyone in a channel.
const WHOLE_CHANNEL = ["@all", "@channel", "@here"];

function renderProposal(data) {
  if (proposed.source !== data) {
    Object.assign(proposed, {
      source: data,
      draft: data,
      theirs: data.saved === false && data.theirs ? data.theirs : null,
      stage: data.saved === false && data.theirs ? "choosing" : "proposed",
      text: "",
      written: false,
      confirm: null,
      post: null,
      busy: false,
      unsure: false,
    });
  }
  const draft = proposed.draft;
  switch (proposed.stage) {
    case "posted":
      return renderPosted(proposed.post);
    case "choosing":
      return choosing(draft, proposed.theirs);
    case "editing":
      return editing(draft);
    case "discarded":
      return ended(draft, t("proposal.discarded"), draft.channel_url);
    case "kept":
      return ended(draft, t("proposal.kept"), draft.url);
    case "gone":
      return ended(draft, t("proposal.gone"), draft.channel_url);
    case "elsewhere":
      return ended(draft, t("proposal.elsewhere"), draft.url);
    default:
      return waiting(draft);
  }
}

// proposalHeader names where the draft waits, as a post's view names where
// it went.
function proposalHeader(draft) {
  const place = placeOf(draft);
  return el("header", { class: "thread-header" },
    el("span", { class: "muted posted-label" }, draft.root_id ? t("proposal.label_reply") : t("proposal.label")),
    el("h2", { class: "thread-title" },
      place.channel ? linkButton(place.channelURL, [place.channel], { class: "link channel-name" }) : t("thread.title")),
    place.team ? el("span", { class: "muted team" }, place.team) : null);
}

// preview is the text as it will be posted, or as written, with a warning
// when it holds characters the eye cannot see.
function preview(draft, text) {
  const place = placeOf(draft);
  const hidden = hiddenCharacters(text);
  return [
    el("div", { class: "proposal-text" },
      proposed.written ? asWritten(text) : renderMarkdown(text, { base: place.base, team: place.teamURL, targets: true })),
    hidden > 0 ? el("p", { class: "proposal-warning", role: "note" }, t("proposal.hidden", { count: hidden })) : null,
    el("button", {
      type: "button",
      class: "link muted written-toggle",
      "aria-pressed": String(proposed.written),
      onclick: () => {
        proposed.written = !proposed.written;
        render();
      },
    }, proposed.written ? t("proposal.as_posted") : t("proposal.as_written")),
  ];
}

// waiting is the proposal as it waits in the person's draft, with what they
// can do with it here.
function waiting(draft) {
  const changes = CHANGES && view.callsTools;
  const notes = Array.isArray(draft.notes) ? draft.notes : [];
  return el("article", { class: "thread proposal" },
    proposalHeader(draft),
    el("div", { class: "proposal-card" }, preview(draft, draft.message)),
    notes.length > 0 ? el("ul", { class: "proposal-notes muted" }, notes.map((note) => el("li", {}, note))) : null,
    el("p", { class: "muted proposal-status" }, POSTS && changes ? t("proposal.waits") : t("proposal.send_there")),
    proposed.confirm ? confirmation(draft, proposed.confirm) : null,
    el("div", { class: "proposal-actions" },
      POSTS && changes ? el("button", {
        type: "button",
        class: "action primary",
        disabled: proposed.busy || proposed.confirm || proposed.unsure ? true : undefined,
        onclick: () => press({ action: "post", shown: draft.message }),
      }, t("proposal.post")) : null,
      changes ? el("button", {
        type: "button",
        class: "action",
        disabled: proposed.busy ? true : undefined,
        onclick: () => {
          proposed.stage = "editing";
          proposed.text = draft.message;
          render();
        },
      }, t("proposal.edit")) : null,
      changes ? el("button", {
        type: "button",
        class: "action",
        disabled: proposed.busy ? true : undefined,
        onclick: () => press({ action: "discard", shown: draft.message }),
      }, t("proposal.discard")) : null,
      linkButton(draft.url, [t("proposal.open")], { class: "link muted" })));
}

// editing is the draft's text in a box the person changes, and saves into
// the draft.
function editing(draft) {
  const box = el("textarea", {
    class: "proposal-editor",
    rows: String(Math.min(12, Math.max(3, proposed.text.split("\n").length + 1))),
    "aria-label": t("proposal.edit"),
    oninput: (event) => {
      proposed.text = event.target.value;
    },
  }, proposed.text);
  return el("article", { class: "thread proposal" },
    proposalHeader(draft),
    box,
    el("div", { class: "proposal-actions" },
      el("button", {
        type: "button",
        class: "action primary",
        disabled: proposed.busy ? true : undefined,
        onclick: () => press({ action: "edit", shown: draft.message, message: proposed.text }),
      }, t("proposal.save")),
      el("button", {
        type: "button",
        class: "action",
        onclick: () => {
          proposed.stage = "proposed";
          render();
        },
      }, t("proposal.cancel"))));
}

// choosing is the person's own draft beside the proposal, or the proposal as
// a revision of it, for them to keep theirs or put the proposal in its place.
// Nothing is written until they press.
function choosing(draft, theirs) {
  const revises = Boolean(view.input && view.input.revises_draft);
  const place = placeOf(draft);
  const changes = CHANGES && view.callsTools;
  const differences = revises ? wordDifferences(theirs.message, draft.message) : null;
  return el("article", { class: "thread proposal" },
    proposalHeader(draft),
    el("p", { class: "muted proposal-status" }, t("proposal.choose")),
    differences
      ? el("section", { class: "proposal-card", "aria-label": t("proposal.revision") },
        el("h3", { class: "proposal-heading" }, t("proposal.revision")),
        el("pre", { class: "as-written diff" }, differences.map(([kind, text]) =>
          kind === "same" ? text : el(kind === "added" ? "ins" : "del", {}, text))))
      : [
        el("section", { class: "proposal-card", "aria-label": t("proposal.yours") },
          el("h3", { class: "proposal-heading" }, t("proposal.yours")),
          renderMarkdown(theirs.message, { base: place.base, team: place.teamURL, targets: true })),
        el("section", { class: "proposal-card", "aria-label": t("proposal.proposal") },
          el("h3", { class: "proposal-heading" }, t("proposal.proposal")),
          preview(draft, draft.message)),
      ],
    el("div", { class: "proposal-actions" },
      changes ? el("button", {
        type: "button",
        class: "action primary",
        disabled: proposed.busy ? true : undefined,
        onclick: () => press({ action: "replace", shown: theirs.message, message: draft.message }),
      }, revises ? t("proposal.apply") : t("proposal.replace")) : null,
      el("button", {
        type: "button",
        class: "action",
        onclick: () => {
          proposed.stage = "kept";
          tellModel("The person kept their own draft in " + placeName(draft) + "; the proposal was not saved.");
          render();
        },
      }, t("proposal.keep")),
      linkButton(theirs.url || draft.url, [t("proposal.open")], { class: "link muted" })));
}

// ended is what the view shows once the proposal is no longer to act on.
function ended(draft, text, url) {
  return el("article", { class: "thread proposal" },
    proposalHeader(draft),
    el("p", { class: "muted proposal-status", role: "status" }, text),
    el("div", { class: "proposal-actions" }, linkButton(url, [t("notice.open")], { class: "link muted" })));
}

// confirmation asks before a message that alerts a whole channel, or a user
// group, where Mattermost would ask.
function confirmation(draft, notifies) {
  const mentions = Array.isArray(notifies.mentions) ? notifies.mentions.map((mention) => String(mention).toLowerCase()) : [];
  const whole = mentions.some((mention) => WHOLE_CHANNEL.includes(mention));
  const here = mentions.length === 1 && mentions[0] === "@here";
  const people = Number(notifies.people) || 0;
  const zones = Number(notifies.timezones) || 0;
  let question;
  if (!whole) {
    question = t("confirm.group", { mention: notifies.mentions[0] || "", people });
  } else if (zones > 1) {
    question = here ? t("confirm.here_timezones", { people, count: zones }) : t("confirm.all_timezones", { people, count: zones });
  } else {
    question = here ? t("confirm.here", { people }) : t("confirm.all", { people });
  }
  const title = whole ? t("confirm.title") : t("confirm.title_groups");
  return el("div", { class: "confirm", role: "dialog", "aria-modal": "true", "aria-label": title },
    el("h3", { class: "confirm-title" }, title),
    el("p", { class: "confirm-question" }, question),
    el("div", { class: "proposal-actions" },
      el("button", {
        type: "button",
        class: "action",
        onclick: () => {
          proposed.confirm = null;
          render();
        },
      }, t("confirm.cancel")),
      el("button", {
        type: "button",
        class: "action primary",
        disabled: proposed.busy || proposed.unsure ? true : undefined,
        onclick: () => press({ action: "post", shown: draft.message, confirmed: true }),
      }, t("confirm.confirm"))));
}

// press sends what the person pressed through the tool only views call, for
// the draft the view shows, and draws what came of it. Where the host
// refuses the call, the view says so and offers the draft in Mattermost.
async function press(args) {
  if (proposed.busy) return;
  const draft = proposed.draft;
  proposed.busy = true;
  render();
  let result;
  try {
    const place = { channel_id: draft.channel_id };
    if (draft.root_id) place.root_id = draft.root_id;
    result = await bridge.callTool("view_change", Object.assign(place, args));
  } catch (error) {
    proposed.busy = false;
    // Where the host lost a Post, it may have gone through: the person looks
    // in Mattermost rather than posting it twice.
    if (args.action === "post" && error && error.unanswered) proposed.unsure = true;
    notice(proposed.unsure ? t("proposal.unsure") : t("proposal.refused"), draft.url);
    return;
  }
  proposed.busy = false;
  const change = result && !result.isError ? result.structuredContent : null;
  if (!change || typeof change.status !== "string") {
    notice((result && textOf(result)) || t("proposal.refused"), draft.url);
    return;
  }
  outcome(args, change);
}

// outcome draws what came of a press, and tells the model what the person
// did, in mm-mcp's words.
function outcome(args, change) {
  const draft = proposed.draft;
  proposed.confirm = null;
  switch (change.status) {
    case "posted":
      proposed.stage = "posted";
      proposed.post = change.post;
      tellModel("The person posted the proposal from its view, in " + placeName(draft) + ": " + (change.post && change.post.url ? change.post.url : "") +
        ". The text posted, as a JSON string: " + JSON.stringify(change.post ? change.post.message : draft.message));
      break;
    case "confirm":
      proposed.confirm = change.notifies || null;
      break;
    case "saved":
      proposed.draft = Object.assign({}, draft, change.draft);
      proposed.stage = "proposed";
      if (args.action === "replace") {
        proposed.theirs = null;
        tellModel("The person put the proposal in place of their own draft in " + placeName(draft) + "; it waits there for them to send.");
      } else {
        notice(t("proposal.edited"));
        tellModel("The person changed the proposal's text in its view. The draft in " + placeName(draft) +
          " is theirs now, and propose_post leaves it as it is. Its text, as a JSON string: " + JSON.stringify(change.draft ? change.draft.message : args.message));
      }
      break;
    case "discarded":
      proposed.stage = "discarded";
      tellModel("The person discarded the proposal in " + placeName(draft) + ".");
      break;
    case "changed":
      // Drawn again as it is now: what the person sees is what a press acts on.
      if (proposed.stage === "choosing") {
        proposed.theirs = Object.assign({}, proposed.theirs, change.draft);
      } else {
        proposed.draft = Object.assign({}, draft, change.draft);
        proposed.stage = "proposed";
      }
      notice(t("proposal.changed"));
      break;
    case "elsewhere":
      proposed.stage = "elsewhere";
      break;
    case "gone":
      proposed.stage = "gone";
      break;
  }
  render();
}

// tellModel puts what the person did in the context the model reads next,
// where the host passes it on; the text it quotes stays data.
function tellModel(text) {
  if (!view.tellsModel) return;
  bridge.updateModelContext(text).catch(() => {});
}

// placeName names the draft's place for the model, as data.
function placeName(draft) {
  return "the channel " + JSON.stringify(draft.channel || draft.channel_id || "");
}

// HIDDEN is each character a reader cannot see, or that turns the text's
// direction, which a message could hide what it says behind: what Unicode
// says a reader's software may draw as nothing, such as soft hyphens,
// zero-width spaces and joiners, fillers, variation selectors and tag
// characters, and the marks and overrides that set a text's direction.
const HIDDEN = /[\p{Default_Ignorable_Code_Point}\p{Bidi_Control}]/u;
const PICTOGRAPH = /\p{Extended_Pictographic}/u;
const MODIFIER = /\p{Emoji_Modifier}/u;
const EMOJI = /\p{Emoji}/u;
const IDEOGRAPH = /\p{Ideographic}/u;
const VARIATION = /\p{Variation_Selector}/u;

// NUMERIC_REFERENCE is a character written as its number, which Markdown
// draws as the character itself.
const NUMERIC_REFERENCE = /^&#(?:[xX]([0-9a-fA-F]{1,6})|([0-9]{1,7}));/;

// hiddenAt reports whether the character at i of chars is hidden. What an
// emoji or a name is drawn with is what it looks like: a zero-width joiner
// between two pictographs, as in a family's emoji; one variation selector,
// after an emoji or an ideograph, which picks how it is drawn; and the tags
// after a black flag that make it Scotland's. A second selector in a row, or
// tags anywhere else, carry what no reader sees.
function hiddenAt(chars, i) {
  const ch = chars[i];
  if (!HIDDEN.test(ch)) return false;
  const code = ch.codePointAt(0);
  const before = chars[i - 1];
  if (code === 0x200d) {
    const joined = before && VARIATION.test(before) ? chars[i - 2] : before;
    const after = chars[i + 1];
    return !(joined && (PICTOGRAPH.test(joined) || MODIFIER.test(joined)) && after && PICTOGRAPH.test(after));
  }
  if (VARIATION.test(ch)) return !(before && !VARIATION.test(before) && (EMOJI.test(before) || IDEOGRAPH.test(before)));
  if (code >= 0xe0020 && code <= 0xe007f) return !inSubdivisionFlag(chars, i);
  return true;
}

// inSubdivisionFlag reports whether the tag at i of chars is in a flag of a
// country's part: a black flag, up to six tags, and the tag that ends them.
function inSubdivisionFlag(chars, i) {
  const at = (k) => (chars[k] ? chars[k].codePointAt(0) : -1);
  const tag = (k) => at(k) >= 0xe0020 && at(k) <= 0xe007e;
  let start = i;
  while (start > i - 7 && tag(start - 1)) start--;
  let end = i;
  while (end < i + 7 && tag(end)) end++;
  return at(start - 1) === 0x1f3f4 && end - start >= 1 && end - start <= 6 && at(end) === 0xe007f;
}

// hiddenParts is text as what a reader sees and what they cannot: runs of
// text, and each hidden character, by its code point, with how it is written
// when it is written as its number.
function hiddenParts(text) {
  const chars = Array.from(String(text || ""));
  const parts = [];
  let run = "";
  const hide = (code, written) => {
    parts.push(run, { code: "U+" + code.toString(16).toUpperCase().padStart(4, "0"), written });
    run = "";
  };
  for (let i = 0; i < chars.length; i++) {
    if (chars[i] === "&") {
      const reference = NUMERIC_REFERENCE.exec(chars.slice(i, i + 12).join(""));
      const code = reference ? parseInt(reference[1] || reference[2], reference[1] ? 16 : 10) : 0;
      if (code > 0 && code <= 0x10ffff && (code < 0xd800 || code > 0xdfff) && HIDDEN.test(String.fromCodePoint(code))) {
        hide(code, reference[0]);
        i += reference[0].length - 1;
        continue;
      }
    }
    if (hiddenAt(chars, i)) {
      hide(chars[i].codePointAt(0), "");
      continue;
    }
    run += chars[i];
  }
  parts.push(run);
  return parts.filter((part) => part !== "");
}

function hiddenCharacters(text) {
  return hiddenParts(text).filter((part) => typeof part !== "string").length;
}

// asWritten is the text as it was written, each hidden character shown by its
// code point, and one written as its number marked where it stands.
function asWritten(text) {
  return el("pre", { class: "as-written" }, hiddenParts(text).map((part) => typeof part === "string"
    ? part
    : el("span", { class: "hidden-char", title: part.code }, part.written || part.code)));
}

// MAX_DIFF_CELLS bounds the table a revision's differences are found with; a
// longer pair of texts is shown side by side instead.
const MAX_DIFF_CELLS = 250000;

// wordDifferences is how after differs from before, word by word: runs of
// words kept, removed and added, in order, or null for texts too long to
// compare.
function wordDifferences(before, after) {
  const a = String(before || "").split(/(\s+)/).filter((word) => word !== "");
  const b = String(after || "").split(/(\s+)/).filter((word) => word !== "");
  if ((a.length + 1) * (b.length + 1) > MAX_DIFF_CELLS) return null;
  const width = b.length + 1;
  const common = new Uint32Array((a.length + 1) * width);
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = b.length - 1; j >= 0; j--) {
      common[i * width + j] = a[i] === b[j] ? common[(i + 1) * width + j + 1] + 1 : Math.max(common[(i + 1) * width + j], common[i * width + j + 1]);
    }
  }
  const parts = [];
  const add = (kind, word) => {
    const last = parts[parts.length - 1];
    if (last && last[0] === kind) last[1] += word;
    else parts.push([kind, word]);
  };
  let i = 0;
  let j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) {
      add("same", a[i]);
      i++;
      j++;
    } else if (common[(i + 1) * width + j] >= common[i * width + j + 1]) {
      add("removed", a[i++]);
    } else {
      add("added", b[j++]);
    }
  }
  while (i < a.length) add("removed", a[i++]);
  while (j < b.length) add("added", b[j++]);
  return parts;
}

// ---- main.js ----
// The view: it waits for the result of the call it belongs to, and draws it.
//
// What a person does here goes through the host: a link opens through
// ui/open-link, a picture is read through resources/read, and more of a
// thread, or a channel or a thread opened in place, comes from the tools only
// views call. The view never speaks for the
// person, so it never writes in the conversation in their name, and it acts
// only on a click: hosts run a view's code again when a conversation is
// reopened.

const CONNECT_TIMEOUT_MS = 10000;
const NO_RESULT_MS = 60000;

const bridge = createBridge({ name: "mm-mcp", version: "1" });

const view = {
  // What the host lets the view do, from its answer to ui/initialize.
  readsResources: false,
  callsTools: false,
  opensLinks: true,
  tellsModel: false,
  // Whether the host shows the view fullscreen.
  fullscreen: false,
  // What the view draws: the call's arguments, and its result.
  input: null,
  result: null,
  // The results a quote was opened from, latest last, for the way back.
  trail: [],
  // The pictures the result carried, for a host that passes on no read.
  carried: null,
  error: "",
  waited: false,
  standalone: false,
  notice: null,
  lightbox: null,
};

bridge.on("ui/notifications/tool-input", (params) => {
  view.input = params && typeof params.arguments === "object" ? params.arguments : {};
  render();
});

bridge.on("ui/notifications/tool-result", (result) => {
  view.result = null;
  view.trail = [];
  view.lightbox = null;
  view.error = "";
  view.carried = result && result._meta ? result._meta["mm-mcp/pictures"] : null;
  if (!result || typeof result !== "object") {
    view.error = t("view.nothing");
  } else if (result.isError) {
    view.error = textOf(result) || t("view.failed");
  } else if (result.structuredContent && typeof result.structuredContent === "object") {
    view.result = result.structuredContent;
  } else {
    view.error = textOf(result) || t("view.nothing");
  }
  render();
});

bridge.on("ui/notifications/tool-cancelled", () => {
  view.error = t("view.cancelled");
  render();
});

bridge.on("ui/notifications/host-context-changed", (context) => applyHostContext(context));

function textOf(result) {
  const parts = Array.isArray(result.content) ? result.content : [];
  return parts.filter((part) => part && part.type === "text" && typeof part.text === "string").map((part) => part.text).join("\n");
}

function applyHostContext(context) {
  if (!context || typeof context !== "object") return;
  const root = document.documentElement;
  if (context.theme === "light" || context.theme === "dark") root.dataset.theme = context.theme;
  const styles = context.styles || {};
  for (const [name, value] of Object.entries(styles.variables || {})) {
    if (name.startsWith("--") && typeof value === "string") root.style.setProperty(name, value);
  }
  if (styles.css && typeof styles.css.fonts === "string") {
    document.getElementById("host-fonts").textContent = styles.css.fonts;
  }
  if (typeof context.locale === "string") setLanguage(context.locale);
  // Fullscreen is the host's to give and take, by a way of its own beside the
  // view; the view fills what it is given.
  if (context.displayMode === "inline" || context.displayMode === "fullscreen") {
    view.fullscreen = context.displayMode === "fullscreen";
    root.dataset.display = context.displayMode;
  }
  render();
}

// notice is a line the view shows of what it could not do here, with where
// to do it instead.
function notice(text, url) {
  view.notice = { text, url: url || "" };
  render();
}

function render() {
  const app = document.getElementById("app");
  // An opened image is drawn again as itself, and keeps the focus Escape needs.
  const focused = document.activeElement;
  app.replaceChildren(...content());
  if (focused && focused.isConnected) focused.focus({ preventScroll: true });
}

function content() {
  if (view.fullscreen && view.lightbox) return [view.lightbox.box];
  const out = [];
  if (view.notice) {
    out.push(el("p", { class: "notice", role: "status" },
      view.notice.text,
      view.notice.url ? [" ", linkButton(view.notice.url, [t("notice.open")])] : null,
      el("button", { type: "button", class: "link dismiss", "aria-label": t("notice.dismiss"), onclick: () => { view.notice = null; render(); } }, "×")));
  }
  if (view.error) {
    out.push(el("p", { class: "error", role: "alert" }, view.error));
  } else if (view.result) {
    out.push(renderKind(view.result));
  } else if (view.waited) {
    out.push(el("p", { class: "muted", role: "status" }, t("view.no_result")));
  } else {
    out.push(el("div", { class: "skeleton", "aria-busy": "true", "aria-label": t("view.loading") },
      el("span", { class: "skeleton-line" }), el("span", { class: "skeleton-line short" })));
  }
  return out;
}

// renderKind draws the kind of view the call asked for: show names it, a
// tool that posts answers with the post it posted, and propose_post with the
// draft it proposed.
function renderKind(data) {
  const named = view.input && typeof view.input.kind === "string" ? view.input.kind : "";
  const kind = named || (typeof data.saved === "boolean" && typeof data.channel_id === "string" ? "proposal"
    : typeof data.id === "string" && typeof data.author_id === "string" ? "posted" : "thread");
  switch (kind) {
    case "proposal":
      return renderProposal(data);
    case "posted":
      return renderPosted(data);
    case "thread":
      return renderThread(data);
    case "unreads":
      return renderUnreads(data);
    default:
      return el("p", { class: "muted", role: "status" }, t("view.unknown_kind", { kind }));
  }
}

// The host sizes an inline view to what it reports, and a fullscreen one itself.
function watchSize() {
  let queued = false;
  const report = () => {
    queued = false;
    if (view.fullscreen) return;
    const box = document.getElementById("app").getBoundingClientRect();
    bridge.reportSize(Math.ceil(document.documentElement.clientWidth), Math.ceil(box.height));
  };
  new ResizeObserver(() => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(report);
    }
  }).observe(document.getElementById("app"));
}

async function start() {
  setLanguage(navigator.language);
  render();
  watchSize();
  setTimeout(() => {
    if (!view.result && !view.error) {
      view.waited = true;
      render();
    }
  }, NO_RESULT_MS);
  try {
    const result = await bridge.connect(CONNECT_TIMEOUT_MS);
    // A host that says what it can do, and leaves something out, does not do
    // it: its links are shown to open by hand, its pictures are initials, and
    // more of a thread opens in Mattermost.
    const capabilities = result.hostCapabilities;
    if (capabilities && typeof capabilities === "object") {
      view.opensLinks = Boolean(capabilities.openLinks);
      view.callsTools = Boolean(capabilities.serverTools);
      view.readsResources = Boolean(capabilities.serverResources);
      view.tellsModel = Boolean(capabilities.updateModelContext);
    }
    applyHostContext(result.hostContext);
  } catch {
    view.standalone = true;
    render();
  }
}

start();

})();

</script>
</body>
</html>
