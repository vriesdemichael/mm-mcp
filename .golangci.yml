version: "2"

run:
  timeout: 5m
  # The live suite, and the client tests in it, are linted with everything else.
  build-tags:
    - live
    - clients

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
  exclusions:
    rules:
      # tools/, and internal/testclients, which installs the clients the client
      # tests drive, run commands and read and write the files they are told
      # to, by design.
      - path: ^(tools|internal/testclients)/
        linters:
          - gosec
        text: "(G204|G301|G304|G306|G703)"
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

# gofmt is the formatting gate, run by task quality:format:verify with the
# pinned toolchain's gofmt.
formatters:
  enable: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
